name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    # The Windows projects target net8.0-windows, so build and test on Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build Consolify.sln -c Release
      - name: Test
        run: dotnet test Consolify.sln -c Release --no-build --logger "console;verbosity=normal"
